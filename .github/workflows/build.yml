
name: Compilar Muzk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

            - name: Remover recursos inválidos
        run: |
          find Muzk-AndroidStudio/app/src/main/res -type f -name "abc_list_divider_mtrl_alpha.9.png" -delete
          find Muzk-AndroidStudio/app/src/main/res -type f -name "*.9.png" -print
          
      - name: Compilar APK
        run: |
          cd Muzk-AndroidStudio
          gradle assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Muzk-APK
          path: Muzk-AndroidStudio/app/build/outputs/apk/debug/*.apk
